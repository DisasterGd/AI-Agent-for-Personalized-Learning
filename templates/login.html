<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Lumina 学习助手</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent: #7c6af0;
            --accent-hover: #6b58e0;
            --accent-light: #f0eeff;
            --accent-mid: #c4bdf8;
            --bg: #f5f4f0;
            --card-bg: #faf9f7;
            --border: #e0ddd6;
            --text-primary: #2a2825;
            --text-secondary: #6b6660;
            --text-muted: #a09c96;
            --success: #4caf81;
            --danger: #e06b6b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* 背景纹理 */
            background-image:
                radial-gradient(ellipse 900px 600px at 20% 50%, rgba(124,106,240,.06) 0%, transparent 70%),
                radial-gradient(ellipse 600px 800px at 80% 20%, rgba(76,175,129,.05) 0%, transparent 60%);
        }

        /* ── 装饰性浮动圆 ── */
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px);
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(124,106,240,.08); top:-100px; left:-150px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(76,175,129,.07); bottom:-80px; right:-100px; }
        .orb-3 { width: 300px; height: 300px; background: rgba(232,164,74,.05); bottom:30%; left:60%; }

        /* ── 外层卡片 ── */
        .page-card {
            position: relative; z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 32px 80px rgba(42,40,37,.10), 0 1px 0 rgba(255,255,255,.7) inset;
            width: 100%; max-width: 480px;
            padding: 44px 48px 40px;
            animation: card-rise .4s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes card-rise {
            from { opacity:0; transform: translateY(20px) scale(.97); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }

        /* ── Logo ── */
        .logo-area {
            text-align: center; margin-bottom: 32px;
        }
        .logo-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; border-radius: 14px;
            background: var(--accent); margin-bottom: 10px;
        }
        .logo-icon i { color: white; font-size: 18px; }
        .logo-name {
            font-family: 'Lora', serif; font-size: 22px; font-weight: 600;
            color: var(--text-primary); display: block; margin-bottom: 4px;
        }
        .logo-sub { font-size: 13px; color: var(--text-muted); }

        /* ── Tab 切换 ── */
        .tab-bar {
            display: flex; background: var(--bg); border-radius: 11px;
            padding: 4px; gap: 4px; margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1; padding: 8px; border: none; background: transparent;
            border-radius: 8px; font-size: 13.5px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; transition: all .2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: white; color: var(--accent);
            box-shadow: 0 1px 6px rgba(0,0,0,.08);
        }

        /* ── 消息框 ── */
        .msg-box {
            display: none; align-items: center; gap: 8px;
            padding: 9px 13px; border-radius: 9px; font-size: 13px;
            margin-bottom: 16px;
        }
        .msg-box.error   { display:flex; background:#fef0f0; color:var(--danger); border:1px solid #f5c4c4; }
        .msg-box.success { display:flex; background:#f0faf5; color:var(--success); border:1px solid #b8e8d2; }

        /* ── 表单字段 ── */
        .field-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        .field-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }

        .input-wrap { position: relative; }
        .input-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px; pointer-events:none; }

        .field-input, .field-select {
            width: 100%; padding: 10px 12px 10px 36px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 13.5px; color: var(--text-primary);
            background: white; outline: none;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .field-input:focus, .field-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,106,240,.12);
        }
        .field-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(224,107,107,.1); }
        .field-select { appearance: none; cursor: pointer; }

        /* 密码眼睛 */
        .toggle-pw {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 13px; padding: 3px; transition: color .15s;
        }
        .toggle-pw:hover { color: var(--text-secondary); }

        /* ── 提交按钮 ── */
        .submit-btn {
            width: 100%; padding: 11px; background: var(--accent); color: white;
            border: none; border-radius: 11px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: background .2s, transform .1s, box-shadow .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit;
        }
        .submit-btn:hover { background: var(--accent-hover); box-shadow: 0 6px 20px rgba(124,106,240,.30); }
        .submit-btn:active { transform: scale(.98); }
        .submit-btn:disabled { background: var(--accent-mid); cursor: not-allowed; transform: none; box-shadow: none; }

        /* ── 页脚 ── */
        .form-footer { margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-muted); }
        .form-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .form-footer a:hover { text-decoration: underline; }

        /* ── 特性列表（仅在较宽屏展示，装饰用） ── */
        .features {
            display: flex; flex-direction: column; gap: 8px;
            margin-top: 28px; padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .feature-item {
            display: flex; align-items: center; gap: 9px;
            font-size: 12px; color: var(--text-muted);
        }
        .feature-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--accent-mid); flex-shrink: 0;
        }

        /* ── 旋转 ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin .7s linear infinite; }

        /* ── 响应式收窄 ── */
        @media (max-width: 540px) {
            .page-card { padding: 32px 28px 28px; }
        }
    </style>
</head>

<body>
    <!-- 背景装饰 -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="page-card">

        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <span class="logo-name">Lumina</span>
            <span class="logo-sub">个性化多智能体学习助手</span>
        </div>

        <!-- Tab -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">账号登录</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">注册账号</button>
        </div>

        <!-- 消息框 -->
        <div class="msg-box" id="msg-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="msg-text"></span>
        </div>

        <!-- ══ 登录表单 ══ -->
        <div id="form-login">
            <div class="field-group">
                <div>
                    <label class="field-label">账号 / 学号</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="login-username" class="field-input" placeholder="请输入账号或学号" autocomplete="username">
                    </div>
                </div>
                <div>
                    <label class="field-label">密码</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="field-input" placeholder="请输入密码" autocomplete="current-password">
                        <button class="toggle-pw" onclick="togglePassword('login-password',this)" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="login-btn" onclick="handleLogin()">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>登录</span>
            </button>

            <div class="form-footer">
                还没有账号？<a href="#" onclick="switchTab('register')">立即注册</a>
            </div>
        </div>

        <!-- ══ 注册表单 ══ -->
        <div id="form-register" style="display:none">
            <div class="field-group">
                <div>
                    <label class="field-label">学号</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="reg-student-id" class="field-input" placeholder="将作为登录账号">
                    </div>
                </div>
                <div>
                    <label class="field-label">姓名</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="reg-name" class="field-input" placeholder="请输入真实姓名">
                    </div>
                </div>
                <div>
                    <label class="field-label">专业方向</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-book-open input-icon"></i>
                        <select id="reg-major" class="field-select">
                            <option value="">请选择你的专业方向</option>
                            <option value="cs">计算机科学与技术</option>
                            <option value="ee">电子信息工程</option>
                            <option value="se">软件工程</option>
                            <option value="is">信息安全</option>
                            <option value="ai">人工智能</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="field-label">密码</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" class="field-input" placeholder="至少 8 位，包含字母和数字" autocomplete="new-password">
                        <button class="toggle-pw" onclick="togglePassword('reg-password',this)" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="field-label">确认密码</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-confirm" class="field-input" placeholder="再次输入密码" autocomplete="new-password">
                        <button class="toggle-pw" onclick="togglePassword('reg-confirm',this)" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="register-btn" onclick="handleRegister()">
                <i class="fa-solid fa-user-plus"></i>
                <span>注册并开始学习</span>
            </button>

            <div class="form-footer">
                已有账号？<a href="#" onclick="switchTab('login')">直接登录</a>
            </div>
        </div>

        <!-- 特性简介（登录态显示） -->
        <div class="features" id="features-section">
            <div class="feature-item"><div class="feature-dot"></div><span>对话式构建 6 维动态学习画像</span></div>
            <div class="feature-item"><div class="feature-dot"></div><span>多智能体协同生成个性化资源</span></div>
            <div class="feature-item"><div class="feature-dot"></div><span>实时追踪学习效果与路径规划</span></div>
        </div>

    </div>

    <script>
    const API_BASE = 'https://ai-agent-for-personalized-learning.onrender.com';

    // 已登录自动跳转
    if (localStorage.getItem('auth_token')) {
        const p = window.location.pathname;
        window.location.href = p.includes('.html') ? p.replace('login.html','index.html') : '/index';
    }

    function switchTab(tab) {
        clearMsg();
        document.getElementById('form-login').style.display    = tab==='login'    ? 'block' : 'none';
        document.getElementById('form-register').style.display = tab==='register' ? 'block' : 'none';
        document.getElementById('tab-login').classList.toggle('active',    tab==='login');
        document.getElementById('tab-register').classList.toggle('active', tab==='register');
        // 注册时隐藏特性列表（避免太长）
        document.getElementById('features-section').style.display = tab==='login' ? 'flex' : 'none';
    }

    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon  = btn.querySelector('i');
        input.type  = input.type==='password' ? 'text' : 'password';
        icon.className = input.type==='password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    }

    function showMsg(text, type='error') {
        const box  = document.getElementById('msg-box');
        const span = document.getElementById('msg-text');
        box.className = `msg-box ${type}`;
        span.textContent = text;
        box.querySelector('i').className = type==='error'
            ? 'fa-solid fa-circle-exclamation'
            : 'fa-solid fa-circle-check';
    }
    function clearMsg() { document.getElementById('msg-box').className='msg-box'; }

    function validatePassword(pw) { return pw.length>=8 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw); }

    function setLoading(btnId, loading) {
        const btn  = document.getElementById(btnId);
        const icon = btn.querySelector('i');
        const text = btn.querySelector('span');
        btn.disabled = loading;
        if (loading) {
            icon.className='fa-solid fa-circle-notch spin';
            text.textContent='请稍候…';
        } else {
            if (btnId==='login-btn') { icon.className='fa-solid fa-arrow-right-to-bracket'; text.textContent='登录'; }
            else { icon.className='fa-solid fa-user-plus'; text.textContent='注册并开始学习'; }
        }
    }

    async function handleLogin() {
        clearMsg();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username) { showMsg('请输入账号或学号'); return; }
        if (!password)  { showMsg('请输入密码'); return; }

        setLoading('login-btn', true);
        try {
            const res  = await fetch(`${API_BASE}/api/auth/login`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success===true || data.token) {
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user_info', JSON.stringify(data.user));
                showMsg('登录成功，正在跳转…','success');
                const p = window.location.pathname;
                setTimeout(() => { window.location.href = p.includes('.html') ? p.replace('login.html','index.html') : '/index'; }, 700);
            } else {
                showMsg(data.message || '账号或密码错误');
            }
        } catch(err) {
            showMsg('无法连接服务器，请确认后端已启动');
        } finally { setLoading('login-btn', false); }
    }

    async function handleRegister() {
        clearMsg();
        const studentId = document.getElementById('reg-student-id').value.trim();
        const name      = document.getElementById('reg-name').value.trim();
        const major     = document.getElementById('reg-major').value;
        const password  = document.getElementById('reg-password').value;
        const confirm   = document.getElementById('reg-confirm').value;

        if (!studentId)                    { showMsg('请输入学号'); return; }
        if (!name)                         { showMsg('请输入姓名'); return; }
        if (!major)                        { showMsg('请选择专业方向'); return; }
        if (!validatePassword(password))   { showMsg('密码至少 8 位，且需包含字母和数字'); return; }
        if (password!==confirm)            { showMsg('两次密码不一致'); return; }

        setLoading('register-btn', true);
        try {
            const res  = await fetch(`${API_BASE}/api/auth/register`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ student_id:studentId, name, major, password })
            });
            const data = await res.json();
            if (data.success===true) {
                if (data.token) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_info', JSON.stringify(data.user));
                    showMsg('注册成功，正在跳转…','success');
                    const p = window.location.pathname;
                    setTimeout(() => { window.location.href = p.includes('.html') ? p.replace('login.html','index.html') : '/index'; }, 700);
                } else {
                    showMsg('注册成功！请登录','success');
                    setTimeout(() => switchTab('login'), 1800);
                }
            } else {
                showMsg(data.message || '注册失败，学号可能已存在');
            }
        } catch(err) {
            showMsg('无法连接服务器，请确认后端已启动');
        } finally { setLoading('register-btn', false); }
    }

    document.addEventListener('keydown', e => {
        if (e.key!=='Enter') return;
        const isLogin = document.getElementById('form-login').style.display!=='none';
        isLogin ? handleLogin() : handleRegister();
    });
    </script>
</body>
</html>
